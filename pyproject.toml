[project]
name = "home-ai-cluster-plugin-searxng"
version = "0.2.0.dev0"
description = "Fixed-loopback SearXNG external-information acquisition plugin for Home AI Cluster."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.13,<3.15"
dependencies = [
    "httpx>=0.28.0",
]

[project.urls]
Repository = "https://github.com/frian/home-ai-cluster-plugin-searxng"
Issues = "https://github.com/frian/home-ai-cluster-plugin-searxng/issues"

[project.entry-points."home_ai_cluster.external_information_acquisition.v1"]
searxng = "home_ai_cluster_plugin_searxng.plugin:acquire"

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "ruff>=0.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/home_ai_cluster_plugin_searxng"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
